  // ---------- list mode ----------
  let mode = store.get("mode2", "map");
  const legName = i => (i <= 7 ? "Leg 1: Home to Dillon" : i <= 22 ? "Leg 2: Dillon to Big Sky" : "Leg 3: Big Sky to home");

  function prow(id, label, opts = {}) {
    const isIdea = !P[id] && !!IDEA[id];
    const p = P[id] || mine.find(s => s.id === id) || IDEA[id]; if (!p) return "";
    const isMine = !P[id] && !isIdea;
    const icon = isIdea ? ICAT[p.cat].icon : isMine ? (MY_CATS[p.cat] || MY_CATS.note).icon : (p.emoji || "");
    const canVisit = isMine || p.type === "fun" || p.type === "meal";
    if (isIdea) return `<div class="prow">
      <div class="pn">${icon} ${esc(p.name)}</div>
      <p class="pnote">${esc(p.note)} ${esc(p.detour)}.</p>
      <div class="btnrow">
        ${voteBtn(id)}
        <button class="btn" data-addidea="${id}" ${inPlan(id) ? "disabled" : ""}>${inPlan(id) ? "In the plan ✓" : "Add to plan"}</button>
        <button class="btn" data-showidea="${id}">Show on map</button>
        <a class="btn" href="${dirUrl(p)}" target="_blank" rel="noopener">Directions</a>
        ${infoLink(p)}
      </div></div>`;
    return `<div class="prow ${done[id] ? "visited" : ""}">
      <div class="pn">${icon ? icon + " " : ""}${label ? esc(label) + ": " : ""}${esc(p.name)}</div>
      ${p.note ? `<p class="pnote">${esc(p.note)}</p>` : ""}
      <div class="btnrow">
        <a class="btn" href="${dirUrl(p)}" target="_blank" rel="noopener">Directions</a>
        <button class="btn" data-showmap="${id}">Show on map</button>
        ${p.link ? `<a class="btn" href="${p.link}" target="_blank" rel="noopener">Trail info</a>` : ""}
        ${infoLink(p)}
        ${canVisit ? `<button class="btn" data-visit="${id}">${done[id] ? "Visited ✓" : "Mark visited"}</button>` : ""}
        ${isMine ? voteBtn(id) + `<button class="btn" data-edit="${id}">Edit</button>` : ""}
      </div></div>`;
  }

  function dayItems(d, i) {
    // Every item for a day that passes the filter (used for counts and hiding empty days)
    const ids = [...(d.ride ? d.ride.places : []), ...(d.meals || []).map(m => m[1]), ...(d.fun || []), ...(d.extra || []),
      ...mine.filter(s => s.day === i).map(s => s.id), ...(d.stay ? [d.stay] : []),
      ...(showIdeas ? IDEAS.filter(x => x.day === i).map(x => x.id) : [])];
    return ids.filter(matches);
  }
  function dayBody(d, i) {
    if (navCat !== "all") {
      const f = arr => arr.filter(matches);
      const out = [];
      const rides = d.ride ? f(d.ride.places) : [];
      if (rides.length) out.push(`<div class="blk ride"><h3>Ride</h3><p class="pnote">${esc(d.ride.text)}</p>${rides.map(id => prow(id)).join("")}</div>`);
      const meals = (d.meals || []).filter(([, id]) => matches(id));
      if (meals.length) out.push(`<div class="blk meal"><h3>Scenic meal stop</h3>${meals.map(([m, id]) => prow(id, m)).join("")}</div>`);
      const fun = f([...(d.fun || []), ...(d.extra || [])]);
      if (fun.length) out.push(`<div class="blk fun"><h3>Stops</h3>${fun.map(id => prow(id)).join("")}</div>`);
      const my = mine.filter(s => s.day === i && matches(s.id));
      if (my.length) out.push(`<div class="blk mine"><h3>My spots</h3>${my.map(s => prow(s.id)).join("")}</div>`);
      const ideas = showIdeas ? IDEAS.filter(x => x.day === i && matches(x.id)) : [];
      if (ideas.length) out.push(`<div class="blk idea"><h3>Ideas for this day</h3>${ideas.map(x => prow(x.id)).join("")}</div>`);
      if (d.stay && matches(d.stay)) out.push(`<div class="blk stay"><h3>Tonight</h3>${prow(d.stay)}</div>`);
      return out.join("");
    }
    const out = [];
    if (d.drive) out.push(`<div class="blk drive"><h3>Drive</h3><p>${esc(d.drive.from)} to ${esc(d.drive.to)}, about ${d.drive.miles} miles and ${d.drive.hours} hours</p></div>`);
    if (d.ride) out.push(`<div class="blk ride"><h3>Ride</h3><p class="pnote">${esc(d.ride.text)}</p>${d.ride.places.map(id => prow(id)).join("")}</div>`);
    if (d.note || d.extra) out.push(`<div class="blk note"><h3>Heads up</h3>${d.note ? `<p>${esc(d.note)}</p>` : ""}${(d.extra || []).map(id => prow(id)).join("")}</div>`);
    if (d.meals) out.push(`<div class="blk meal"><h3>Scenic meal stop</h3>${d.meals.map(([m, id]) => prow(id, m)).join("")}</div>`);
    if (d.fun) out.push(`<div class="blk fun"><h3>Fun stops</h3>${d.fun.map(id => prow(id)).join("")}</div>`);
    const my = mine.filter(s => s.day === i);
    if (my.length) out.push(`<div class="blk mine"><h3>My spots</h3>${my.map(s => prow(s.id)).join("")}</div>`);
    const ideas = showIdeas ? IDEAS.filter(x => x.day === i) : [];
    if (ideas.length) out.push(`<div class="blk idea"><h3>Ideas for this day</h3>${ideas.map(x => prow(x.id)).join("")}</div>`);
    if (d.stay) out.push(`<div class="blk stay"><h3>Tonight</h3>${prow(d.stay)}</div>`);
    return out.join("");
  }

  function renderList(openIdx, filterChanged) {
    const td = todayDiff();
    const filtered = navCat !== "all";
    const openSet = new Set(filterChanged ? [] : [...document.querySelectorAll("details.dayc[open]")].map(el => Number(el.dataset.i)));
    if (openIdx !== undefined) openSet.add(openIdx);
    if (!document.querySelector("details.dayc") && openIdx === undefined) openSet.add(td >= 0 && td < T.days.length ? td : 0);
    let html = `<div class="listwrap"><div class="listtools">
      <button class="btn" data-expand="all">Expand all</button>
      <button class="btn" data-expand="none">Collapse all</button>
      <button class="btn add" data-addspot="1">+ Add a spot</button></div>
      <div class="legtabs" role="group" aria-label="Show a leg on the map">${[1, 2, 3].map(n =>
        `<button class="btn" data-leg="${n}" aria-pressed="${activeLeg === n}" aria-label="Show ${LEGS[n].label} on the map">🗺️ Leg ${n}</button>`).join("")}</div>`;
    let lastLeg = "";
    let shown = 0;
    T.days.forEach((d, i) => {
      const count = dayItems(d, i).length;
      if (filtered && !count) return;
      shown++;
      if (filtered) openSet.add(i);
      const leg = legName(i);
      if (leg !== lastLeg) { html += `<h2 class="legtitle">${leg}</h2>`; lastLeg = leg; }
      const myCount = mine.filter(s => s.day === i).length;
      const tags = filtered ? `${count} match${count === 1 ? "" : "es"}` : [d.ride ? "🚵" : "", d.drive ? `🚗 ${d.drive.miles} mi` : "", myCount ? `📌 ${myCount}` : ""].filter(Boolean).join(" ");
      html += `<details class="dayc ${i === td ? "today" : ""}" id="day-${i}" data-i="${i}" ${openSet.has(i) ? "open" : ""}>
        <summary>${shield(i + 1)}<span><span class="t">${esc(d.title)}</span><span class="d">${longDate(d.date)}</span></span><span class="tags">${tags}</span></summary>
        <div class="dbody">${dayBody(d, i)}</div></details>`;
    });
    if (filtered && !shown) html += `<p class="emptynote">Nothing in this category. Tap “All” at the top to see everything.</p>`;
    const loose = mine.filter(s => (s.day === null || s.day === undefined) && matches(s.id));
    html += `<h2 class="legtitle">My spots without a day (${loose.length})</h2>`;
    html += loose.length ? `<div class="dayc" style="padding:4px 14px">${loose.map(s => prow(s.id)).join("")}</div>`
      : `<p class="fineprint">Spots you add without picking a day show up here.</p>`;
    html += `</div>`;
    suppressToggle = true; setTimeout(() => { suppressToggle = false; }, 400);
    $("listMain").innerHTML = html;
    document.querySelectorAll("details.dayc").forEach(el => el.classList.toggle("active", Number(el.dataset.i) === activeDay));
  }

  function setBarHeight() { document.documentElement.style.setProperty("--bar-h", document.querySelector(".bar").offsetHeight + "px"); }

  function setMode(m) {
    mode = m; store.set("mode2", m);
    document.body.classList.toggle("mode-list", m === "list");
    document.body.classList.toggle("mode-map", m === "map");
    document.body.classList.toggle("mode-ideas", m === "ideas");
    document.body.classList.toggle("mode-today", m === "today");
    document.body.classList.remove("filters-open");
    document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
    if (m === "list") {
      renderList(); initPreview();
      setTimeout(() => { if (activeDay === null && !activeLeg) { const td = todayDiff(); previewDay(td >= 0 && td < T.days.length ? td : (Number((document.querySelector("details.dayc[open]") || {}).dataset?.i) || 0)); } else refreshPreview(); }, 60);
    }
    else if (m === "ideas") renderIdeas();
    else if (m === "today") renderToday();
    else { setTimeout(() => { map.invalidateSize(); highlightDay(); }, 0); }
  }

  // ---------- list map preview ----------
  const LEGS = { 1: { label: "Leg 1: Home to Dillon", from: 0, to: 7 }, 2: { label: "Leg 2: Dillon to Big Sky", from: 8, to: 22 }, 3: { label: "Leg 3: Big Sky to home", from: 23, to: 28 } };
  let pmap = null, pLayer = null, activeDay = null, activeLeg = null, suppressToggle = false;

  function initPreview() {
    if (pmap) { setTimeout(() => pmap.invalidateSize(), 0); return; }
    pmap = L.map("pmap", { zoomControl: true, scrollWheelZoom: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, crossOrigin: true, attribution: "&copy; OpenStreetMap contributors" }).addTo(pmap);
    pLayer = L.layerGroup().addTo(pmap);
    pmap.fitBounds(routeLine.getBounds(), { padding: [10, 10] });
  }

  // Where each night's stop falls along the route line, so each day's drive can be cut out of it
  function routeCuts() {
    const pts = routeLine.getLatLngs();
    const idx = []; let last = 0;
    T.days.forEach(d => {
      const p = P[d.stay];
      if (p) {
        let best = last, bd = Infinity;
        for (let k = last; k < pts.length; k++) {
          const dd = (pts[k].lat - p.lat) ** 2 + (pts[k].lng - p.lng) ** 2;
          if (dd < bd - 1e-9) { bd = dd; best = k; }
        }
        last = best;
      }
      idx.push(last);
    });
    return { pts, idx };
  }
  function segment(cuts, i) {
    if (i < 0 || i >= T.days.length) return [];
    const a = i === 0 ? 0 : cuts.idx[i - 1], b = cuts.idx[i];
    return b > a ? cuts.pts.slice(a, b + 1) : [];
  }
  function itemLatLng(id) { const p = P[id] || IDEA[id] || mine.find(s => s.id === id); return p ? [p.lat, p.lng] : null; }
  function itemIcon(id) {
    if (IDEA[id] && !P[id]) return `<div class="pin idea">${ICAT[IDEA[id].cat].icon}</div>`;
    const sp = !P[id] && mine.find(s => s.id === id);
    if (sp) return `<div class="pin mine"><span>${(MY_CATS[sp.cat] || MY_CATS.note).icon}</span></div>`;
    const p = P[id]; return `<div class="pin">${p.emoji || (KIND[p.type] || {}).icon || "📍"}</div>`;
  }
  function addPins(ids) {
    ids.forEach(id => {
      const ll = itemLatLng(id); if (!ll) return;
      const name = (P[id] || IDEA[id] || mine.find(s => s.id === id)).name;
      L.marker(ll, { icon: L.divIcon({ className: "", html: itemIcon(id), iconSize: [26, 26], iconAnchor: [13, 13] }), title: name })
        .bindTooltip(esc(name), { direction: "top", offset: [0, -10] }).addTo(pLayer);
    });
  }
  const legend = `<div class="plegend"><span><i style="border-color:#8A9A8E;border-top-style:dashed"></i>Day before</span><span><i style="border-color:#1D4E89"></i>This day</span><span><i style="border-color:#D9621A;border-top-style:dashed"></i>Day after</span></div>`;

  function previewDay(i) {
    if (!pmap || i === null || i === undefined) return;
    activeDay = i; activeLeg = null;
    document.querySelectorAll("details.dayc").forEach(el => el.classList.toggle("active", Number(el.dataset.i) === i));
    document.querySelectorAll("[data-leg]").forEach(b => b.setAttribute("aria-pressed", "false"));
    const cuts = routeCuts(), d = T.days[i];
    pLayer.clearLayers();
    const prev = segment(cuts, i - 1), cur = segment(cuts, i), next = segment(cuts, i + 1);
    if (prev.length) L.polyline(prev, { color: "#8A9A8E", weight: 4, dashArray: "6 7", opacity: 0.9 }).addTo(pLayer);
    if (next.length) L.polyline(next, { color: "#D9621A", weight: 4, dashArray: "6 7", opacity: 0.85 }).addTo(pLayer);
    if (cur.length) L.polyline(cur, { color: "#1D4E89", weight: 6, opacity: 0.9 }).addTo(pLayer);
    const ids = dayItems(d, i);
    addPins(ids);
    const pts = [...cur, ...ids.map(itemLatLng).filter(Boolean)];
    if (!pts.length && P[d.stay]) pts.push([P[d.stay].lat, P[d.stay].lng]);
    if (pts.length > 1) pmap.fitBounds(L.latLngBounds(pts), { padding: [24, 24], maxZoom: 12 });
    else if (pts.length) pmap.setView(pts[0], 11);
    const drive = d.drive ? `${esc(d.drive.from)} to ${esc(d.drive.to)}, ${d.drive.miles} mi` : "No long drive";
    $("pcap").innerHTML = `
      <button class="btn" data-pday="${i - 1}" ${i === 0 ? "disabled" : ""} aria-label="Previous day">◀ Day ${i}</button>
      <span class="ptitle">Day ${i + 1}: ${esc(d.title)}<small>${longDate(d.date)} · ${drive}</small></span>
      <button class="btn" data-pday="${i + 1}" ${i === T.days.length - 1 ? "disabled" : ""} aria-label="Next day">Day ${i + 2} ▶</button>` + legend;
  }

  function previewLeg(n) {
    if (!pmap) return;
    const L3 = LEGS[n]; activeLeg = n; activeDay = null;
    document.querySelectorAll("details.dayc").forEach(el => el.classList.remove("active"));
    document.querySelectorAll("[data-leg]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.leg) === n)));
    const cuts = routeCuts();
    pLayer.clearLayers();
    L.polyline(cuts.pts, { color: "#8A9A8E", weight: 3, opacity: 0.5 }).addTo(pLayer);
    let legPts = [];
    for (let i = L3.from; i <= L3.to; i++) { const seg = segment(cuts, i); if (seg.length) { L.polyline(seg, { color: "#1D4E89", weight: 5, opacity: 0.9 }).addTo(pLayer); legPts = legPts.concat(seg); } }
    const ids = [];
    for (let i = L3.from; i <= L3.to; i++) dayItems(T.days[i], i).forEach(id => { if (!ids.includes(id)) ids.push(id); });
    addPins(ids);
    const all = [...legPts, ...ids.map(itemLatLng).filter(Boolean)];
    if (all.length) pmap.fitBounds(L.latLngBounds(all), { padding: [20, 20] });
    $("pcap").innerHTML = `<span class="ptitle">${L3.label}<small>Days ${L3.from + 1}–${L3.to + 1} · ${longDate(T.days[L3.from].date)} to ${longDate(T.days[L3.to].date)}</small></span>
      <button class="btn" data-pday="${L3.from}">Start of leg ▶</button>`;
  }
  function refreshPreview() { if (activeLeg) previewLeg(activeLeg); else if (activeDay !== null) previewDay(activeDay); }

  function scrollToDay(i) {
    renderList(i);
    const el = $("day-" + i); if (el) { el.open = true; el.scrollIntoView({ block: "start" }); }
    previewDay(i);
  }



  // ---------- route options (alternates) ----------
  const DATA_ALTS = T.alternates || [];
  let userAlts = store.get("alts", []);       // routes built in the app
  let builder = null;                          // draft being edited
  const legCache = {};
  const addDays = (iso, n) => { const d = parse(iso); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const startOf = from => from === 0 ? P.home : P[T.days[from - 1].stay];
  const hrs = h => Number(h) || 0;
  function mainSpan(from, to) {
    let miles = 0, longest = 0;
    for (let i = from; i <= to; i++) { const d = T.days[i].drive; if (d) { miles += d.miles; longest = Math.max(longest, hrs(d.hours)); } }

  // A built route turns into days: one driving day per stop, plus extra days for extra nights
  function draftDays(dr) {

      const leg = dr.legs[k] || {};
      const isHome = st.home;
      days.push({ date, title: `To ${st.name}`, drive: { from: prev.name, to: st.name, miles: leg.miles ? Math.round(leg.miles) : "?", hours: leg.hours ? leg.hours.toFixed(1) : "?" , est: leg.est },
        stay: { name: isHome ? "Home" : st.name, lat: st.lat, lng: st.lng }, stops: [] });
      date = addDays(date, 1);
      for (let n = 1; n < (isHome ? 1 : st.nights); n++) { days.push({ date, title: `Day in ${st.name}`, stay: { name: st.name, lat: st.lat, lng: st.lng }, stops: [] }); date = addDays(date, 1); }

  async function legInfo(a, b) {

    if (legCache[key]) return legCache[key];

  // ----- show a route option on the map -----
  const altLayer = L.layerGroup().addTo(map);

  async function showAlt(a) {

  // ---------- explore more around a leg (OpenStreetMap) ----------

    eat: ['nwr["amenity"~"^(restaurant|cafe|ice_cream)$"]["name"]["cuisine"]'],

  function legPoints(n) {

      });

  }
  async function runExplore(cat) {

    const pts = legPoints(activeStage), R = XR[cat];
    const q = `[out:json][timeout:25];(${pts.map(p => OQ[cat].map(f => `${f}(around:${R},${p.lat},${p.lng});`).join("")).join("")});out center tags 200;`;

      const res = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: "data=" + encodeURIComponent(q), headers: { "Content-Type": "application/x-www-form-urlencoded" } });

        ...Object.entries(P).filter(([, p]) => ["camp", "hotel", "host", "home"].includes(p.type)).map(([id, p]) => [p.name, p.lat, p.lng, p.type === "home"]),
        ...DATA_ALTS.flatMap(a => a.days.map(d => [d.stay.name, d.stay.lat, d.stay.lng, d.stay.name === "Home"]))
      ].filter((x, k, arr) => arr.findIndex(y => y[0] === x[0]) === k);
      const k = known[Number(e.target.value)];
      builder.stops.push({ name: k[0], lat: k[1], lng: k[2], nights: 1, home: k[3] }); builderChanged();
    }
  });

  // ---------- shared sync (optional) ----------
  window.addEventListener("tripsync-ready", () => {
    const S = window.TripSync;
    if (!S || !S.enabled) { if (mode === "ideas") renderIdeas(); return; }
    shared = true;
    let first = true;
    S.onChange(state => {
      state.firstMerge = first;
      if (first) {
        first = false;
        // Push spots made on this phone before sharing was turned on
        mine.forEach(sp => { if (!state.spots[sp.id]) S.setSpot(sp); });
        Object.keys(done).forEach(id => { if (!state.done[id]) S.setDone(id, true); });
      }
      if (state.firstMerge) {
        mine = Object.values(Object.assign({}, ...mine.map(sp => ({ [sp.id]: sp })), state.spots));
      } else {
        mine = Object.values(state.spots);
      }
      votes = state.votes; done = Object.assign({}, state.done);
      if (state.alts) {
        if (state.firstMerge) userAlts.forEach(a => { if (!state.alts[a.id] && S.setAlt) S.setAlt(a); });
        userAlts = state.firstMerge ? Object.values(Object.assign({}, ...userAlts.map(a => ({ [a.id]: a })), state.alts)) : Object.values(state.alts);
        store.set("alts", userAlts);
      }
      store.set("mine", mine); store.set("votes", votes); store.set("done", done);
      refreshAll();
    });
    if (mode === "ideas") renderIdeas();
  });
  map.on("click", () => { if (!document.body.classList.contains("adding") && !isSplit()) setOpen(false); });

  // ---------- status + start ----------
  const td = todayDiff();
  $("status").textContent = td < 0 ? `${-td} days to go` : td >= T.days.length ? "Trip complete" : `Day ${td + 1} of ${T.days.length}`;
  renderNav();
  drawBuiltIns(); drawIdeas(); drawMine(); applyFilters();
  map.fitBounds(routeLine.getBounds(), fitPad());
  const startDay = td >= 0 && td < T.days.length ? td : null;
  selectDay(startDay, startDay !== null);
  setBarHeight(); window.addEventListener("resize", setBarHeight);
  updateOnline();
  if (startDay !== null) mode = "today";  // during the trip, open to Today
  setMode(mode);
  if (mode === "list" && startDay !== null) scrollToDay(startDay);
})();
</script>
