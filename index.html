<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#2F5D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Road Trip 2027</title>
<!-- App version 16 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #EEF2EA; --surface: #F9FBF6; --ink: #17251C; --muted: #56655A; --line: #D3DCCF;
    --forest: #2F5D3A; --blaze: #D9621A; --road: #1D4E89; --shield-red: #B3282D;
    --fun: #7A4FA3; --meal: #A07614; --mine: #C2185B; --focus: #1D4E89;
    --sheet-peek: 150px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1712; --surface: #16231B; --ink: #E5ECE3; --muted: #9DAE9F; --line: #2A3A30;
      --forest: #7CC08B; --blaze: #F08A45; --road: #7FA9E0; --fun: #B996DA; --meal: #D9B04F;
      --mine: #F48FB1; --focus: #9CC2F0; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif; }
  h1, h2, h3 { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 0.01em; margin: 0; }
  a { color: var(--road); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button, .btn, select, input, textarea { font: inherit; }

  #map { position: fixed; inset: 0; z-index: 1; background: var(--bg); }

  /* Top bar with day strip */
  .bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 500;
    background: var(--forest); color: #fff;
    padding-top: env(safe-area-inset-top, 0px);
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  @media (prefers-color-scheme: dark) { .bar { background: #1E3A27; } }
  .bar .row { display: flex; align-items: baseline; justify-content: space-between; padding: 8px 14px 4px; }
  .bar h1 { font-size: 1.3rem; }
  .bar .status { font-size: 0.9rem; opacity: 0.9; }
  .navcats { display: flex; gap: 6px; overflow-x: auto; padding: 2px 10px 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .navcats::-webkit-scrollbar { display: none; }
  .navcats button { flex: none; border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 999px; padding: 4px 11px; font-size: 0.9rem; cursor: pointer; white-space: nowrap; }
  .navcats button[aria-pressed="true"] { background: #fff; color: var(--forest); border-color: #fff; font-weight: 700; }
  .navcats .sep { flex: none; width: 1px; background: rgba(255,255,255,.35); margin: 4px 2px; }
  body.mode-ideas .navcats .ideastoggle, body.mode-ideas .navcats .sep { display: none; }
  .emptynote { color: var(--muted); padding: 10px 2px; }
  .days { display: flex; gap: 6px; overflow-x: auto; padding: 6px 10px 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .days::-webkit-scrollbar { display: none; }
  .days button {
    flex: none; border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff;
    border-radius: 10px; padding: 4px 9px; line-height: 1.15; text-align: center; cursor: pointer;
  }
  .days button b { display: block; font-family: "Barlow Condensed", sans-serif; font-size: 1.15rem; }
  .days button small { font-size: 0.72rem; opacity: 0.85; }
  .days button[aria-pressed="true"] { background: #fff; color: var(--road); border-color: #fff; }
  .days button.today { box-shadow: inset 0 -3px 0 var(--blaze); }

  /* Floating buttons */
  .fab, .locate {
    position: fixed; z-index: 550; right: 14px; border: 0; cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,.3);
  }
  .fab {
    bottom: calc(var(--sheet-peek) + 16px + env(safe-area-inset-bottom, 0px));
    background: var(--mine); color: #fff; border-radius: 999px; padding: 12px 18px; font-weight: 700;
  }
  .locate {
    bottom: calc(var(--sheet-peek) + 76px + env(safe-area-inset-bottom, 0px));
    width: 48px; height: 48px; border-radius: 50%; background: var(--surface); color: var(--ink); font-size: 1.4rem;
  }
  body.sheet-open .fab, body.sheet-open .locate, body.adding .fab, body.adding .locate { display: none; }

  /* Add mode */
  .crosshair { position: fixed; z-index: 520; left: 50%; top: 50%; transform: translate(-50%, -100%); pointer-events: none; font-size: 40px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  .placebar {
    position: fixed; z-index: 560; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-radius: 14px; padding: 12px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.3);
  }
  .placebar p { margin: 0 0 10px; }
  [hidden] { display: none !important; }

  /* Bottom sheet */
  .sheet {
    position: fixed; z-index: 540; left: 0; right: 0; bottom: 0;
    max-width: 720px; margin: 0 auto;
    background: var(--surface); color: var(--ink);
    border-radius: 16px 16px 0 0; box-shadow: 0 -4px 18px rgba(0,0,0,.25);
    height: var(--sheet-peek); transition: height .2s ease;
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body.sheet-open .sheet { height: 50vh; }
  body.sheet-open.sheet-full .sheet { height: 88vh; }
  .sheet.dragging { transition: none; }
  /* Small screens: drop the title row so the map gets more room */
  @media (max-width: 639px), (max-height: 500px) { .bar .row { display: none; } .bar .modes { margin-top: 8px; } }
  .handle { touch-action: none; }

  /* Side-by-side: map on the left, details on the right (laptops, tablets, phones turned sideways) */
  @media (min-width: 900px), (orientation: landscape) and (min-width: 640px) {
    :root { --panel-w: min(460px, 42vw); }
    .sheet, body.sheet-open .sheet, body.sheet-open.sheet-full .sheet {
      left: auto; right: 0; top: var(--bar-h, 150px); bottom: 0; height: auto; width: var(--panel-w); max-width: none; margin: 0;
      border-radius: 0; box-shadow: -2px 0 12px rgba(0,0,0,.15); padding-bottom: env(safe-area-inset-bottom, 0px); }
    body.adding .sheet { display: flex; }
    .handle { display: none; }
    #map { right: var(--panel-w); }
    .fab, body.sheet-open .fab { display: block; right: calc(var(--panel-w) + 14px); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
    .locate, body.sheet-open .locate { display: block; right: calc(var(--panel-w) + 14px); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
    body.adding .fab, body.adding .locate { display: none; }
    .crosshair { left: calc((100vw - var(--panel-w)) / 2); }
    .placebar { right: calc(var(--panel-w) + 12px); }
    .sheet-body { padding-top: 14px; }
  }
  body.adding .sheet { display: none; }
  .handle { border: 0; background: transparent; padding: 8px 0 4px; cursor: pointer; width: 100%; flex: none; }
  .handle span { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
  .sheet-body { overflow-y: auto; padding: 2px 16px 18px; flex: 1; -webkit-overflow-scrolling: touch; }

  .head { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; margin-bottom: 10px; }
  .shield { width: 52px; height: 55px; }
  .shield text { font-family: "Barlow Condensed", sans-serif; font-weight: 700; }
  .head h2 { font-size: 1.6rem; line-height: 1.05; }
  .head p { margin: 0; color: var(--muted); font-size: 0.92rem; }
  .summary { margin: 0 0 12px; }

  .btn, button.btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
    border-radius: 999px; padding: 7px 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-size: 0.92rem;
  }
  .btn.primary { background: var(--forest); color: #fff; border-color: var(--forest); }
  .btn.danger { color: var(--shield-red); }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }

  .stops { list-style: none; margin: 0 0 14px; padding: 0; }
  .stops li + li { border-top: 1px solid var(--line); }
  .stops li { display: flex; align-items: center; gap: 6px; }
  .stops li > button { flex: 1; }
  .infolink { flex: none; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 1rem; color: var(--ink); background: var(--surface); }
  .stops button {
    width: 100%; border: 0; background: transparent; color: inherit; text-align: left; cursor: pointer;
    display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 9px 2px; align-items: start;
  }
  .stops .ic { font-size: 1.15rem; text-align: center; }
  .stops .k { color: var(--muted); font-size: 0.82rem; display: block; }
  .stops .n { font-weight: 700; }
  .stops li.done .n { text-decoration: line-through; }
  .section-title { font-size: 1.15rem; margin: 14px 0 4px; color: var(--forest); }

  .stagehead { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-bottom: 6px; }
  .stagehead h2 { font-size: 1.35rem; line-height: 1.1; }
  .stagehead p { margin: 2px 0 0; color: var(--muted); font-size: 0.86rem; }
  .stagehead .btn { padding: 8px 12px; font-size: 1rem; }
  .stagenum { font-size: 0.78rem; color: var(--road); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .dayhead { width: 100%; text-align: left; border: 0; border-radius: 10px; background: var(--bg); color: var(--ink); cursor: pointer;
    display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 8px 10px; margin: 12px 0 2px; font-weight: 700; }
  .dayhead small { color: var(--muted); font-weight: 400; }
  .dayhead.focus { background: var(--road); color: #fff; }
  .dayhead.focus small { color: #e5ecf7; }
  .stagelist { list-style: none; padding: 0; margin: 6px 0 14px; }
  .stagelist button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; cursor: pointer; display: grid; grid-template-columns: 30px 1fr; gap: 8px; }
  .stagelist b { color: var(--road); }
  .stagelist small { color: var(--muted); display: block; }
  .backrow { margin-bottom: 8px; }
  .detail h2 { font-size: 1.6rem; margin-bottom: 2px; }
  .detail .kind { color: var(--muted); margin: 0 0 8px; }
  .detail .note { margin: 0 0 12px; }

  form.add label { display: block; font-weight: 700; margin: 10px 0 4px; }
  form.add input, form.add select, form.add textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); color: var(--ink);
  }
  form.add textarea { min-height: 70px; resize: vertical; }
  .cats { display: flex; gap: 6px; flex-wrap: wrap; }
  .cats button[aria-pressed="true"] { background: var(--mine); color: #fff; border-color: var(--mine); }
  .formerror { color: var(--shield-red); margin: 6px 0 0; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
  .chips button[aria-pressed="false"] { opacity: 0.5; }
  .chips .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .fineprint { color: var(--muted); font-size: 0.86rem; }

  /* Map pins */
  .pin { font-size: 20px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); transition: opacity .15s; }
  .pin.mine { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--mine); border: 2px solid #fff; }
  .pin.mine span { transform: rotate(45deg); font-size: 15px; }
  .dim { opacity: 0.25; }
  .leaflet-top { top: calc(var(--bar-h, 150px) + 6px); }


  /* View modes */
  .bar .row { gap: 10px; align-items: center; }
  .bar .row h1 { flex: 1; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(255,255,255,.15); border-radius: 12px; padding: 3px; margin: 2px 10px 4px; }
  .modes button { border: 0; background: transparent; color: #fff; border-radius: 9px; padding: 7px 6px; cursor: pointer; font-weight: 700; font-size: 1rem; }
  .modes button[aria-pressed="true"] { background: #fff; color: var(--forest); }
  
  #listView { position: fixed; inset: 0; z-index: 450; overflow-y: auto; background: var(--bg);
    padding: 0 0 calc(28px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
  body.mode-list #map, body.mode-list .fab, body.mode-list .locate, body.mode-list .sheet, body.mode-list .crosshair, body.mode-list .placebar,
  body.mode-ideas #map, body.mode-ideas .fab, body.mode-ideas .locate, body.mode-ideas .sheet, body.mode-ideas .crosshair, body.mode-ideas .placebar { display: none !important; }
  body.mode-map #listView, body.mode-map #ideasView, body.mode-list #ideasView, body.mode-ideas #listView { display: none; }
  #ideasView { position: fixed; inset: 0; z-index: 450; overflow-y: auto; background: var(--bg);
    padding: calc(var(--bar-h, 110px) + 12px) 0 calc(28px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
  .syncnote { border-radius: 10px; padding: 8px 12px; margin: 0 0 10px; font-size: 0.92rem; background: var(--surface); border: 1px solid var(--line); }
  .syncnote.on { border-color: var(--forest); }
  .whoami { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .whoami input { flex: 1; min-width: 140px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); color: var(--ink); }
  .ideasbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .ideasbar button[aria-pressed="true"] { background: var(--forest); color: #fff; border-color: var(--forest); }
  .ideasbar select { border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; background: var(--surface); color: var(--ink); }
  .idea { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .idea h3 { font-family: "Atkinson Hyperlegible", system-ui, sans-serif; font-size: 1.05rem; font-weight: 700; letter-spacing: 0; }
  .idea .meta { color: var(--muted); font-size: 0.88rem; margin: 2px 0 6px; }
  .idea p { margin: 0 0 8px; }
  .idea .src { color: var(--muted); font-size: 0.82rem; }
  .voters { color: var(--muted); font-size: 0.86rem; margin: 6px 0 0; }
  .vote[aria-pressed="true"] { background: var(--road); color: #fff; border-color: var(--road); }
  .pin.idea { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 2px solid #0F7C86; font-size: 14px; }
  .listwrap { max-width: 720px; margin: 0 auto; padding: 0 14px; }
  .listtools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .listtools .btn.add { background: var(--mine); color: #fff; border-color: var(--mine); }
  .legtitle { font-size: 1.35rem; color: var(--forest); margin: 20px 0 8px; }
  :root { --pmap-h: 34vh; }
  .lsplit { max-width: 1200px; margin: 0 auto; padding-top: var(--bar-h, 150px); }
  .lpane { position: sticky; top: var(--bar-h, 150px); z-index: 20; background: var(--bg); padding: 0 14px 10px; }
  #pmap { height: var(--pmap-h); min-height: 190px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
  .pcap { display: flex; align-items: center; gap: 6px; padding: 8px 0 6px; flex-wrap: wrap; }
  .pcap .ptitle { flex: 1; min-width: 150px; font-weight: 700; line-height: 1.2; }
  .pcap .ptitle small { display: block; font-weight: 400; color: var(--muted); font-size: 0.82rem; }
  .pcap .btn { padding: 5px 10px; font-size: 0.85rem; }
  .plegend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); margin-top: 6px; }
  .plegend i { display: inline-block; width: 18px; height: 0; border-top: 4px solid; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  .legtabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; }
  .legtabs button[aria-pressed="true"] { background: var(--road); color: #fff; border-color: var(--road); }
  details.dayc.active { border-color: var(--road); box-shadow: 0 0 0 2px var(--road); }
  @media (min-width: 900px) {
    details.dayc { scroll-margin-top: calc(var(--bar-h, 110px) + 10px); }
    .lsplit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 18px; align-items: start; }
    .lpane { order: 2; padding: 0 14px 0 0; }
    #listMain { padding-top: 10px; }
    #pmap { height: calc(100vh - var(--bar-h, 150px) - 90px); }
    #listMain .listwrap { max-width: none; }
    :root { --pmap-h: 0px; }
  }
  details.dayc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; scroll-margin-top: calc(var(--bar-h, 110px) + var(--pmap-h) + 115px); }
  details.dayc.today { border-color: var(--blaze); box-shadow: inset 4px 0 0 var(--blaze); }
  details.dayc > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; }
  details.dayc > summary::-webkit-details-marker { display: none; }
  details.dayc > summary .shield { width: 40px; height: 42px; }
  details.dayc > summary .t { font-weight: 700; display: block; font-size: 1.05rem; }
  details.dayc > summary .d { color: var(--muted); font-size: 0.88rem; }
  details.dayc > summary .tags { color: var(--muted); font-size: 0.88rem; text-align: right; white-space: nowrap; }
  details.dayc > summary .tags::after { content: "▾"; display: inline-block; margin-left: 8px; transition: transform .15s; }
  details.dayc[open] > summary .tags::after { transform: rotate(180deg); }
  .dbody { padding: 2px 14px 14px; border-top: 1px solid var(--line); }
  .blk { border-left: 4px solid var(--c, var(--line)); padding: 2px 0 2px 12px; margin-top: 14px; }
  .blk h3 { font-size: 1.1rem; color: var(--c); margin-bottom: 4px; }
  .blk.drive { --c: var(--road); } .blk.ride { --c: var(--blaze); } .blk.stay { --c: var(--forest); }
  .blk.fun { --c: var(--fun); } .blk.idea { --c: #0F7C86; } .blk.meal { --c: var(--meal); } .blk.note { --c: var(--muted); } .blk.mine { --c: var(--mine); }
  .blk p { margin: 0; }
  .prow { padding: 8px 0; border-top: 1px solid var(--line); }
  .prow:first-of-type { border-top: 0; }
  .prow .pn { font-weight: 700; }
  .prow .pnote { color: var(--muted); margin: 2px 0 6px; font-size: 0.94rem; }
  .prow.visited .pn { text-decoration: line-through; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ===== v14: slim header, bottom tabs, Today view ===== */
  :root { --tab-h: calc(60px + env(safe-area-inset-bottom, 0px)); }
  .bar .row, .bar .modes { display: none !important; }
  .toprow { display: flex; align-items: center; gap: 6px; padding: 8px 0 8px 10px; padding-top: calc(8px + env(safe-area-inset-top, 0px) * 0); }
  .toprow .days { flex: 1; padding: 0 10px 0 2px; }
  .filterbtn { flex: none; border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12); color: #fff; border-radius: 12px;
    padding: 6px 10px; cursor: pointer; font-weight: 700; line-height: 1.1; text-align: center; min-height: 44px; }
  .filterbtn small { display: block; font-weight: 400; font-size: 0.72rem; opacity: 0.9; }
  .filterbtn.active { background: #fff; color: var(--forest); }
  .navcats { position: absolute; left: 0; right: 0; top: 100%; display: none; flex-wrap: wrap; gap: 8px; padding: 10px 12px 14px;
    background: var(--forest); box-shadow: 0 6px 12px rgba(0,0,0,.25); overflow: visible; }
  @media (prefers-color-scheme: dark) { .navcats { background: #1E3A27; } }
  body.filters-open .navcats { display: flex; }
  .navcats button { padding: 8px 14px; font-size: 0.95rem; }
  .navcats .sep { display: none; }
  .navcats .ideastoggle { margin-left: auto; }
  .offline { background: #6B4E16; color: #fff; text-align: center; font-size: 0.85rem; padding: 3px 8px; }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 700; height: var(--tab-h); padding-bottom: env(safe-area-inset-bottom, 0px);
    display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -2px 8px rgba(0,0,0,.08); }
  .tabs button { border: 0; background: transparent; color: var(--muted); font-size: 0.78rem; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .tabs button span { font-size: 1.35rem; line-height: 1; filter: grayscale(0.6); }
  .tabs button[aria-pressed="true"] { color: var(--forest); box-shadow: inset 0 3px 0 var(--forest); }
  .tabs button[aria-pressed="true"] span { filter: none; }

  #map { bottom: var(--tab-h); }
  .sheet { bottom: var(--tab-h); padding-bottom: 0; }
  body.sheet-open .sheet { height: 45vh; }
  body.sheet-open.sheet-full .sheet { height: 80vh; }
  .fab { bottom: calc(var(--sheet-peek) + var(--tab-h) + 16px); }
  .locate { bottom: calc(var(--sheet-peek) + var(--tab-h) + 76px); }
  .placebar { bottom: calc(var(--tab-h) + 16px); }
  #listView { padding-bottom: calc(var(--tab-h) + 24px); }
  #ideasView { padding-bottom: calc(var(--tab-h) + 24px); }
  @media (min-width: 900px), (orientation: landscape) and (min-width: 640px) {
    .sheet, body.sheet-open .sheet, body.sheet-open.sheet-full .sheet { bottom: var(--tab-h); height: auto; }
    .fab, body.sheet-open .fab { bottom: calc(var(--tab-h) + 16px); }
    .locate, body.sheet-open .locate { bottom: calc(var(--tab-h) + 76px); }
    #pmap { height: calc(100vh - var(--bar-h, 150px) - var(--tab-h) - 90px); }
  }

  /* Routes and explore */
  .segtabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .segtabs button { border: 0; background: transparent; color: var(--ink); border-radius: 9px; padding: 9px; font-weight: 700; cursor: pointer; }
  .segtabs button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .altcard { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid #7B3FA0; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .altcard.main { border-left-color: var(--road); }
  .altcard h3 { font-family: "Atkinson Hyperlegible", system-ui, sans-serif; font-size: 1.05rem; font-weight: 700; letter-spacing: 0; margin-bottom: 4px; }
  .altstats { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 0.88rem; margin: 6px 0 8px; }
  .altstats b { color: var(--ink); }
  .warn { color: #9A4A00; }
  @media (prefers-color-scheme: dark) { .warn { color: #F3A76A; } }
  .altday { border-top: 1px solid var(--line); padding: 8px 0; }
  .altday .t { font-weight: 700; }
  .altday ul { margin: 4px 0 0; padding-left: 18px; }
  .altday li { margin: 2px 0; }
  .altday li a { font-size: 0.85rem; margin-left: 6px; }
  details.altdays summary { cursor: pointer; color: var(--road); font-weight: 700; margin: 4px 0; }
  .builder label { display: block; font-weight: 700; margin: 10px 0 4px; }
  .builder input, .builder select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: var(--bg); color: var(--ink); }
  .bstop { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .bstop .leg { color: var(--muted); font-size: 0.84rem; }
  .bstop .ctrls { display: flex; gap: 4px; align-items: center; }
  .bstop .ctrls select { width: auto; padding: 5px; }
  .bstop .ctrls .btn { padding: 5px 9px; }
  .searchrow { display: flex; gap: 6px; }
  .searchrow input { flex: 1; }
  .results button { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 10px; margin-top: 5px; cursor: pointer; }
  .altbanner { position: fixed; z-index: 530; left: 10px; right: 10px; top: calc(var(--bar-h, 70px) + 8px); background: #7B3FA0; color: #fff; border-radius: 12px; padding: 8px 12px;
    display: flex; gap: 10px; align-items: center; box-shadow: 0 3px 10px rgba(0,0,0,.3); font-size: 0.9rem; }
  .altbanner span { flex: 1; }
  .altbanner button { border: 1px solid rgba(255,255,255,.6); background: transparent; color: #fff; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  body:not(.mode-map) .altbanner { display: none; }
  @media (min-width: 900px), (orientation: landscape) and (min-width: 640px) { .altbanner { right: calc(var(--panel-w) + 10px); } }
  .altpin { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #7B3FA0; color: #fff; font-weight: 700; font-size: 13px; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .altstop { font-size: 16px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
  .explore { margin-top: 18px; border-top: 2px solid var(--line); padding-top: 12px; }
  .explore .chips button[aria-pressed="true"] { background: var(--forest); color: #fff; border-color: var(--forest); }
  .xrow { padding: 9px 0; border-top: 1px solid var(--line); }
  .xrow:first-child { border-top: 0; }
  .xrow .n { font-weight: 700; }
  .xrow .k { color: var(--muted); font-size: 0.84rem; }
  .xrow .btnrow { margin-top: 5px; }
  .xpin { width: 14px; height: 14px; border-radius: 50%; background: #E0A800; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5); }

  /* Today view */
  #todayView { display: none; position: fixed; inset: 0; z-index: 450; overflow-y: auto; background: var(--bg);
    padding: calc(var(--bar-h, 70px) + 12px) 0 calc(var(--tab-h) + 24px); -webkit-overflow-scrolling: touch; }
  body.mode-today #todayView { display: block; }
  body.mode-today #map, body.mode-today .fab, body.mode-today .locate, body.mode-today .sheet, body.mode-today .crosshair,
  body.mode-today .placebar, body.mode-today #listView, body.mode-today #ideasView { display: none !important; }
  body:not(.mode-today) #todayView { display: none; }
  .tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .tcard h3 { font-size: 1.2rem; color: var(--forest); margin-bottom: 6px; }
  .tcard p { margin: 0 0 8px; }
  .tbanner { border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; background: var(--road); color: #fff; }
  .tbanner b { display: block; font-size: 1.05rem; }
  .tstop { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .tstop:first-of-type { border-top: 0; }
  .tstop .ic { font-size: 1.3rem; text-align: center; }
  .tstop .k { color: var(--muted); font-size: 0.82rem; }
  .tstop .n { font-weight: 700; }
  .tstop.next { background: color-mix(in srgb, var(--road) 9%, transparent); border-radius: 10px; padding: 10px 8px; }
  .tstop.next .k { color: var(--road); font-weight: 700; }
  .tstop.visited .n { text-decoration: line-through; color: var(--muted); }
  .tstop .btnrow { margin-top: 6px; }
  .nearbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .nearbtns button[aria-pressed="true"] { background: var(--forest); color: #fff; border-color: var(--forest); }
  .nearrow { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .nearrow:first-child { border-top: 0; }
  .nearrow .dist { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
</style>
</head>
<body>
<div id="map" aria-label="Trip map"></div>
<div id="listView" aria-label="Trip list">
  <div class="lsplit">
    <aside class="lpane" aria-label="Map preview">
      <div class="pcap" id="pcap"></div>
      <div id="pmap"></div>
    </aside>
    <div id="listMain"></div>
  </div>
</div>
<div id="ideasView" aria-label="Ideas and votes"></div>

<header class="bar">
  <span id="status" hidden></span>
  <div class="toprow">
    <button class="filterbtn" id="filterBtn" aria-expanded="false" aria-controls="navcats"></button>
    <div class="days" id="days" aria-label="Choose a day"></div>
  </div>
  <div class="navcats" id="navcats" role="group" aria-label="Show only"></div>
  <div class="offline" id="offlineNote" hidden>Offline: showing the saved plan</div>
</header>

<nav class="tabs" aria-label="Views">
  <button data-mode="today" aria-pressed="false"><span aria-hidden="true">📍</span>Today</button>
  <button data-mode="map" aria-pressed="true"><span aria-hidden="true">🗺️</span>Map</button>
  <button data-mode="list" aria-pressed="false"><span aria-hidden="true">📋</span>List</button>
  <button data-mode="ideas" aria-pressed="false"><span aria-hidden="true">💡</span>Ideas</button>
</nav>
<div id="todayView" aria-label="Today"></div>

<button class="locate" id="locateBtn" aria-label="Show where I am">◎</button>
<button class="fab" id="addBtn">+ Add a spot</button>

<div class="crosshair" id="crosshair" hidden aria-hidden="true">📍</div>
<div class="placebar" id="placebar" hidden>
  <p>Move the map until the pin is on the spot.</p>
  <div class="btnrow">
    <button class="btn" id="cancelPlace">Cancel</button>
    <button class="btn primary" id="confirmPlace">Put the pin here</button>
  </div>
</div>

<section class="sheet" id="sheet" aria-label="Details">
  <button class="handle" id="handle" aria-label="Expand or collapse details"><span></span></button>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<script src="config.js?v=16"></script>
<script src="data.js?v=16"></script>
<script src="route-geometry.js?v=16" onerror="window.ROUTE_GEOMETRY = null"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  const T = window.TRIP, P = T.places;
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $ = id => document.getElementById(id);

  // ---------- storage (this phone only) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("rt27:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("rt27:" + k, JSON.stringify(v)); } catch (e) {} }
  };
  let mine = store.get("mine", []);           // spots you add
  let votes = store.get("votes", {});         // itemId -> { voterKey: name }
  let voterName = store.get("voter", "");
  let shared = false;                         // true when Firebase sync is on
  const IDEAS = T.ideas || [];
  const IDEA = Object.fromEntries(IDEAS.map(x => [x.id, x]));
  const ICAT = { eat: { label: "Fun place to eat", icon: "🍴" }, odd: { label: "Odd stop", icon: "🤪" }, view: { label: "View or rest stop", icon: "🏞️" }, swim: { label: "Swim stop", icon: "🏊" }, park: { label: "National park site", icon: "🌲" }, ride: { label: "Ride", icon: "🚵" } };
  let done = store.get("done", {});           // visited marks
  // Navigation filter shared by Map, List, and Ideas
  const NAV = [["all", "All"], ["eat", "🍴 Food"], ["see", "🎡 Attractions"], ["ride", "🚵 Biking"], ["swim", "🏊 Swimming"], ["view", "🏞️ Views & rest stops"], ["park", "🌲 Parks"], ["sleep", "🛏️ Sleep"]];
  let navCat = store.get("navcat", "all");
  let showIdeas = store.get("showIdeas", true);

  // ---------- dates ----------
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const start = parse(T.start);
  const todayDiff = () => { const n = new Date(); return Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - start) / 86400000); };
  const longDate = s => { const d = parse(s); return `${WEEKDAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`; };

  // ---------- categories ----------
  const KIND = {
    camp: { label: "Campground", group: "stay", icon: "⛺" },
    hotel: { label: "Hotel", group: "stay", icon: "🛏️" },
    host: { label: "Staying with family or friends", group: "stay", icon: "🏡" },
    home: { label: "Home", group: "stay", icon: "🏠" },
    airport: { label: "Airport", group: "stay", icon: "✈️" },
    ride: { label: "Riding", group: "ride", icon: "🚵" },
    fun: { label: "Fun stop", group: "fun", icon: "🎉" },
    meal: { label: "Scenic meal stop", group: "meal", icon: "🧺" }
  };
  const MY_CATS = {
    fun: { label: "Fun stop", icon: "🎉" },
    meal: { label: "Food", icon: "🍔" },
    ride: { label: "Ride", icon: "🚵" },
    stay: { label: "Place to sleep", icon: "⛺" },
    gas: { label: "Gas or supplies", icon: "⛽" },
    view: { label: "View or rest stop", icon: "🏞️" },
    swim: { label: "Swim", icon: "🏊" },
    note: { label: "Note", icon: "📝" }
  };
  const GROUPS = {
    stay: { label: "Sleep", color: "#2F5D3A" },
    ride: { label: "Ride", color: "#D9621A" },
    fun: { label: "Fun", color: "#7A4FA3" },
    meal: { label: "Meals", color: "#A07614" },
    mine: { label: "My spots", color: "#C2185B" },
    ideas: { label: "Ideas", color: "#0F7C86" }
  };

  // Which day each built-in place belongs to
  const dayOf = {};
  const dayPlaces = T.days.map((d, i) => {
    const ids = [d.stay, ...(d.ride ? d.ride.places : []), ...(d.fun || []), ...((d.meals || []).map(m => m[1])), ...(d.extra || [])].filter(Boolean);
    ids.forEach(id => { if (dayOf[id] === undefined) dayOf[id] = i; });
    return ids;
  });

  // ---------- map ----------
  const map = L.map("map", { zoomControl: false, tap: true, zoomSnap: 0.25 });
  L.control.zoom({ position: "topleft" }).addTo(map);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, crossOrigin: true, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
  const routeLine = L.polyline(T.route, { color: "#1D4E89", weight: 4, opacity: 0.65, dashArray: "6 8" }).addTo(map);
  loadRoadRoute();

  // Make the route line follow real roads.
  // 1) Use route-geometry.js if it was built (see README).
  // 2) Otherwise use a copy saved on this phone.
  // 3) Otherwise ask the free OSRM routing service once, then save the result.
  async function loadRoadRoute() {
    const KEY = "roadgeom:" + T.route.length + ":" + T.route[1].join(",");
    const apply = pts => { if (pts && pts.length > 10) { routeLine.setLatLngs(pts); routeLine.setStyle({ dashArray: null, opacity: 0.75 }); if (typeof refreshPreview === "function" && mode === "list") refreshPreview(); if (typeof drawStageRoute === "function") drawStageRoute(); } };
    if (Array.isArray(window.ROUTE_GEOMETRY) && window.ROUTE_GEOMETRY.length) { apply(window.ROUTE_GEOMETRY); return; }
    const cached = store.get(KEY, null);
    if (cached) { apply(cached); return; }
    try {
      const pts = [];
      const CHUNK = 25;
      for (let i = 0; i < T.route.length - 1; i += CHUNK - 1) {
        const part = T.route.slice(i, i + CHUNK);
        const coords = part.map(([lat, lng]) => `${lng.toFixed(5)},${lat.toFixed(5)}`).join(";");
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=simplified&geometries=geojson`);
        if (!res.ok) throw new Error("routing " + res.status);
        const data = await res.json();
        if (data.code !== "Ok") throw new Error(data.code);
        data.routes[0].geometry.coordinates.forEach(([lng, lat]) => pts.push([+lat.toFixed(4), +lng.toFixed(4)]));
        await new Promise(r => setTimeout(r, 1100)); // be polite to the free service
      }
      store.set(KEY, pts);
      apply(pts);
    } catch (e) {
      console.warn("Road route unavailable; showing the approximate line", e);
    }
  }

  const markers = {}; // id -> marker

  function iconFor(p, isMine) {
    if (isMine) {
      const c = MY_CATS[p.cat] || MY_CATS.note;
      return L.divIcon({ className: "", html: `<div class="pin mine"><span>${c.icon}</span></div>`, iconSize: [30, 30], iconAnchor: [15, 30] });
    }
    const emoji = p.emoji || (KIND[p.type] || {}).icon || "📍";
    return L.divIcon({ className: "", html: `<div class="pin">${emoji}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] });
  }

  function drawBuiltIns() {
    Object.entries(P).forEach(([id, p]) => {
      const k = KIND[p.type]; if (!k) return;
      const m = L.marker([p.lat, p.lng], { icon: iconFor(p), keyboard: true, title: p.name });
      m.on("click", () => showPlace(id));
      markers[id] = m;
    });
  }
  function drawMine() {
    Object.keys(markers).forEach(id => { if (!P[id] && !IDEA[id]) { map.removeLayer(markers[id]); delete markers[id]; } });
    mine.forEach(s => {
      const m = L.marker([s.lat, s.lng], { icon: iconFor(s, true), title: s.name, keyboard: true });
      m.on("click", () => showMine(s.id));
      markers[s.id] = m;
    });
  }
  function drawIdeas() {
    IDEAS.forEach(x => {
      const icon = L.divIcon({ className: "", html: `<div class="pin idea">${ICAT[x.cat].icon}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
      const m = L.marker([x.lat, x.lng], { icon, title: x.name, keyboard: true });
      m.on("click", () => showIdea(x.id));
      markers[x.id] = m;
    });
  }
  // Which filter categories an item belongs to (an item can be in more than one)
  const PARKRX = /national park|national monument|yellowstone|grand teton|old faithful|oxbow|black canyon|badlands|rushmore/i;
  const SWIMRX = /water ?park|beach|swim|hot spring|noah|kalahari|wilderness resort/i;
  function catsOf(id) {
    const c = new Set();
    if (P[id]) {
      const p = P[id];
      if (p.type === "ride") c.add("ride");
      else if (p.type === "meal") { c.add("eat"); c.add("view"); }
      else if (p.type === "fun") c.add("see");
      else c.add("sleep");
      if (id === "rafting" || SWIMRX.test(p.name + " " + (p.note || ""))) c.add("swim");
      if (PARKRX.test(p.name)) c.add("park");
    } else if (IDEA[id]) {
      const k = IDEA[id].cat; c.add(k === "eat" ? "eat" : k === "odd" ? "see" : k);
    } else {
      const sp = mine.find(x => x.id === id);
      const m = sp && { meal: "eat", fun: "see", ride: "ride", stay: "sleep", swim: "swim", view: "view" }[sp.cat];
      if (m) c.add(m);
      if (sp && (sp.park || PARKRX.test(sp.name))) c.add("park");
    }
    return c;
  }
  const catMatch = id => navCat === "all" || catsOf(id).has(navCat);
  const matches = id => (IDEA[id] && !showIdeas) ? false : catMatch(id);
  function applyFilters() {
    if (typeof shownAlt !== "undefined" && shownAlt) { Object.values(markers).forEach(m => map.removeLayer(m)); return; }
    const inStage = activeStage === null ? null : stageIds(activeStage);
    Object.entries(markers).forEach(([id, m]) => (matches(id) && (!inStage || inStage.has(id))) ? m.addTo(map) : map.removeLayer(m));
    highlightDay();
  }
  function renderFilterBtn() {
    const cur = NAV.find(([k]) => k === navCat);
    const b = $("filterBtn");
    b.innerHTML = navCat === "all" ? `☰ Filter<small>${showIdeas ? "All + ideas" : "All"}</small>` : `${cur[1].split(" ")[0]} Filter<small>${cur[1].split(" ").slice(1).join(" ")}</small>`;
    b.classList.toggle("active", navCat !== "all");
    b.setAttribute("aria-label", "Filter: " + (navCat === "all" ? "showing everything" : cur[1]) + (showIdeas ? ", ideas on" : ", ideas off"));
  }
  function renderNav() {
    renderFilterBtn();
    $("navcats").innerHTML = NAV.map(([k, l]) => `<button data-cat="${k}" aria-pressed="${navCat === k}">${l}</button>`).join("") +
      `<span class="sep" aria-hidden="true"></span><button class="ideastoggle" data-ideastoggle="1" aria-pressed="${showIdeas}">💡 Ideas ${showIdeas ? "on" : "off"}</button>`;
  }
  function setNav(cat, ideas) {
    if (cat !== undefined) { navCat = cat; store.set("navcat", navCat); document.body.classList.remove("filters-open"); $("filterBtn").setAttribute("aria-expanded", "false"); }
    if (ideas !== undefined) { showIdeas = ideas; store.set("showIdeas", showIdeas); }
    renderNav(); applyFilters();
    if (mode === "list") { renderList(undefined, true); refreshPreview(); }
    if (mode === "map" && activeStage !== null && !document.querySelector("#sheetBody .detail, #sheetBody form")) renderStageSheet();
    if (mode === "ideas") renderIdeas();
    if (mode === "today") renderToday();
  }

  // Keep a point visible above the bottom sheet and below the top bar
  const splitMQ = window.matchMedia("(min-width: 900px), (orientation: landscape) and (min-width: 640px)");
  const isSplit = () => splitMQ.matches;
  function sheetHeight() {
    if (isSplit()) return 0;
    const b = document.body.classList;
    return b.contains("sheet-open") ? window.innerHeight * (b.contains("sheet-full") ? 0.8 : 0.45) : 150;
  }
  function focusOn(lat, lng) {
    if (isSplit()) { map.panTo([lat, lng]); return; }
    const sheetH = sheetHeight();
    const topH = document.querySelector(".bar").offsetHeight;
    const tabH = document.querySelector(".tabs").offsetHeight, mapH = window.innerHeight - tabH;
    const targetY = (topH + (mapH - sheetH)) / 2;
    map.panTo([lat, lng], { animate: false });
    map.panBy([0, mapH / 2 - targetY], { animate: true });
  }
  const fitPad = () => ({ paddingTopLeft: [30, document.querySelector(".bar").offsetHeight + 30], paddingBottomRight: [30, isSplit() ? 30 : sheetHeight() + 20] });

  // ---------- day strip ----------
  let selectedDay = null; // null = whole trip
  function renderDays() {
    const td = todayDiff();
    let html = `<button data-day="all" aria-pressed="${selectedDay === null}"><b>All</b><small>trip</small></button>`;
    T.days.forEach((d, i) => {
      const dt = parse(d.date);
      html += `<button data-day="${i}" aria-pressed="${selectedDay === i}" class="${i === td ? "today" : ""}">
        <b>${i + 1}</b><small>${WD[dt.getDay()]} ${dt.getDate()}</small></button>`;
    });
    $("days").innerHTML = html;
    const sel = $("days").querySelector('[aria-pressed="true"]');
    if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
  }

  function highlightDay() {
    const ids = selectedDay === null ? null : new Set([...dayPlaces[selectedDay], ...mine.filter(s => s.day === selectedDay).map(s => s.id), ...IDEAS.filter(x => x.day === selectedDay).map(x => x.id)]);
    Object.entries(markers).forEach(([id, m]) => {
      const el = m.getElement(); if (!el) return;
      el.classList.toggle("dim", !!ids && !ids.has(id));
    });
  }

  function selectDay(i, fly = true) {
    selectedDay = i;
    renderDays();
    showStage(i === null ? null : stageOf(i), false);
    highlightDay();
    if (!fly) return;
    if (i === null) { map.fitBounds(routeLine.getBounds(), fitPad()); return; }
    const pts = [...dayPlaces[i].map(id => [P[id].lat, P[id].lng]), ...mine.filter(s => s.day === i).map(s => [s.lat, s.lng])];
    const prev = i > 0 && T.days[i - 1].stay ? P[T.days[i - 1].stay] : null;
    if (prev && T.days[i].drive) pts.push([prev.lat, prev.lng]);
    if (pts.length) map.fitBounds(L.latLngBounds(pts), Object.assign(fitPad(), { maxZoom: 12 }));
  }

  // ---------- stages (smaller legs on the Map view) ----------
  const STAGES = T.stages || [];
  let activeStage = null;
  const stageLayer = L.layerGroup().addTo(map);
  const stageOf = i => Math.max(0, STAGES.findIndex(s => i >= s.from && i <= s.to));
  function stageIds(n) {
    const st = STAGES[n], ids = new Set();
    for (let i = st.from; i <= st.to; i++) {
      const d = T.days[i];
      [...dayPlaces[i], ...mine.filter(s => s.day === i).map(s => s.id), ...IDEAS.filter(x => x.day === i).map(x => x.id)].forEach(id => ids.add(id));
    }
    if (st.from > 0 && T.days[st.from - 1].stay) ids.add(T.days[st.from - 1].stay); // where the stage starts
    return ids;
  }
  function stageMiles(n) { const st = STAGES[n]; let m = 0; for (let i = st.from; i <= st.to; i++) m += (T.days[i].drive || {}).miles || 0; return m; }
  const shortDate = s => { const d = parse(s); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; };
  function stageDates(n) { const st = STAGES[n]; return st.from === st.to ? longDate(T.days[st.from].date) : `${shortDate(T.days[st.from].date)}–${parse(T.days[st.to].date).getDate()}`; }

  function drawStageRoute() {
    stageLayer.clearLayers();
    if (activeStage === null) { routeLine.setStyle({ color: "#1D4E89", weight: 4, opacity: 0.75 }); return; }
    routeLine.setStyle({ color: "#8A9A8E", weight: 3, opacity: 0.55 });
    const cuts = routeCuts(), st = STAGES[activeStage];
    for (let i = st.from; i <= st.to; i++) {
      const seg = segment(cuts, i); if (!seg.length) continue;
      const focus = i === selectedDay;
      L.polyline(seg, { color: focus ? "#0B3A73" : "#1D4E89", weight: focus ? 7 : 5, opacity: 0.9, interactive: false }).addTo(stageLayer);
    }
  }
  function stageBounds(n, day) {
    const cuts = routeCuts(), st = STAGES[n], pts = [];
    const from = day === undefined || day === null ? st.from : day, to = day === undefined || day === null ? st.to : day;
    for (let i = from; i <= to; i++) {
      segment(cuts, i).forEach(p => pts.push(p));
      dayItems(T.days[i], i).forEach(id => { const ll = itemLatLng(id); if (ll) pts.push(ll); });
      if (T.days[i].stay && P[T.days[i].stay]) pts.push([P[T.days[i].stay].lat, P[T.days[i].stay].lng]);
    }
    return pts.length ? L.latLngBounds(pts) : null;
  }
  function showStage(n, fly = true, day) {
    if (n !== activeStage && typeof exploreLayer !== "undefined") { exploreLayer.clearLayers(); exploreResults = []; exploreFor = null; exploreCat = null; }
    activeStage = n;
    if (day !== undefined) { selectedDay = day; renderDays(); }
    drawStageRoute(); applyFilters(); highlightDay();
    renderSheet();
    if (!fly) return;
    if (n === null) { map.fitBounds(routeLine.getBounds(), fitPad()); return; }
    const b = stageBounds(n, day); if (b) map.fitBounds(b, Object.assign(fitPad(), { maxZoom: 12 }));
  }
  function renderSheet() { if (activeStage === null) showDay(); else renderStageSheet(); }

  function renderStageSheet() {
    const n = activeStage, st = STAGES[n];
    const filt = navCat === "all" ? "" : (NAV.find(([k]) => k === navCat) || [, ""])[1];
    let html = `<div class="stagehead">
        <button class="btn" data-stage="${n === 0 ? "all" : n - 1}" aria-label="Previous leg">◀</button>
        <div><span class="stagenum">Leg ${n + 1} of ${STAGES.length}</span><h2>${esc(st.title)}</h2>
          <p>${stageDates(n)} · ${stageMiles(n) ? `${stageMiles(n).toLocaleString()} mi of driving` : "No long drives"}${filt ? ` · Showing ${filt}` : ""}</p></div>
        <button class="btn" data-stage="${n === STAGES.length - 1 ? "all" : n + 1}" aria-label="Next leg">▶</button>
      </div>`;
    for (let i = st.from; i <= st.to; i++) {
      const d = T.days[i], dt = parse(d.date);
      const items = dayItems(d, i);
      const label = id => {
        if (IDEA[id] && !P[id]) return `Idea · ${ICAT[IDEA[id].cat].label}`;
        if (!P[id]) return "My spot";
        if (id === d.stay) return "Tonight";
        const t = P[id].type;
        return t === "ride" ? "Ride" : t === "meal" ? "Meal stop" : t === "fun" ? "Fun stop" : (KIND[t] || {}).label || "";
      };
      html += `<button class="dayhead ${i === selectedDay ? "focus" : ""}" data-focusday="${i}">
          <span>Day ${i + 1} · ${WD[dt.getDay()]} ${MONTHS[dt.getMonth()]} ${dt.getDate()} · ${esc(d.title)}</span>
          <small>${d.drive ? `🚗 ${d.drive.miles} mi` : d.ride ? "🚵" : ""}</small></button>`;
      if (navCat === "all" && d.drive) html += `<p class="fineprint" style="margin:4px 2px 0">${esc(d.drive.from)} to ${esc(d.drive.to)}, about ${d.drive.hours} hours</p>`;
      if (navCat === "all" && d.note) html += `<p class="fineprint" style="margin:4px 2px 0">⚠️ ${esc(d.note)}</p>`;
      html += items.length ? `<ul class="stops">${items.map(id => stopItem(id, label(id))).join("")}</ul>`
        : `<p class="fineprint" style="margin:6px 2px">Nothing in this category on this day.</p>`;
    }
    $("sheetBody").innerHTML = html + exploreSection();
    if (exploreFor === activeStage && exploreResults.length) renderExploreList();
  }

  // ---------- sheet ----------
  // Phone sheet has three heights: peek (map mostly visible), half (map and details split), full (details)
  function setSheet(state) {
    document.body.classList.toggle("sheet-open", state !== "peek");
    document.body.classList.toggle("sheet-full", state === "full");
  }
  const sheetState = () => !document.body.classList.contains("sheet-open") ? "peek" : document.body.classList.contains("sheet-full") ? "full" : "half";
  const setOpen = open => { if (open) { if (sheetState() === "peek") setSheet("half"); } else setSheet("peek"); };
  $("handle").onclick = () => { if (dragMoved) return; setSheet({ peek: "half", half: "full", full: "peek" }[sheetState()]); };
  let dragStart = null, dragMoved = false;
  $("handle").addEventListener("pointerdown", e => {
    if (isSplit()) return;
    dragStart = { y: e.clientY, h: $("sheet").offsetHeight }; dragMoved = false;
    $("handle").setPointerCapture(e.pointerId);
  });
  $("handle").addEventListener("pointermove", e => {
    if (!dragStart) return;
    const dy = dragStart.y - e.clientY;
    if (Math.abs(dy) > 6) dragMoved = true;
    if (!dragMoved) return;
    const sh = $("sheet"); sh.classList.add("dragging");
    sh.style.height = Math.min(window.innerHeight * 0.92, Math.max(120, dragStart.h + dy)) + "px";
  });
  $("handle").addEventListener("pointerup", () => {
    if (!dragStart) return;
    const sh = $("sheet"), h = sh.offsetHeight, H = window.innerHeight;
    sh.classList.remove("dragging"); sh.style.height = "";
    if (dragMoved) {
      const opts = [["peek", 150], ["half", H * 0.45], ["full", H * 0.8]];
      setSheet(opts.reduce((a, b) => Math.abs(b[1] - h) < Math.abs(a[1] - h) ? b : a)[0]);
    }
    dragStart = null; setTimeout(() => { dragMoved = false; }, 50);
  });
  // New panel content always starts at the top
  new MutationObserver(() => { $("sheetBody").scrollTop = 0; }).observe($("sheetBody"), { childList: true });
  splitMQ.addEventListener("change", () => setTimeout(() => map.invalidateSize(), 50));
  window.addEventListener("resize", () => { if (mode === "map") map.invalidateSize(); });

  function shield(n) {
    return `<svg class="shield" viewBox="0 0 84 88" aria-hidden="true">
      <path d="M8 6 Q42 -2 76 6 Q84 46 42 86 Q0 46 8 6Z" fill="var(--road)" stroke="#fff" stroke-width="3"/>
      <path d="M9.5 7.5 Q42 0 74.5 7.5 L75.5 22 H8.5Z" fill="var(--shield-red)"/>
      <text x="42" y="18.5" text-anchor="middle" font-size="10" fill="#fff">DAY</text>
      <text x="42" y="${n > 9 ? 60 : 62}" text-anchor="middle" font-size="${n > 9 ? 36 : 42}" fill="#fff">${n}</text></svg>`;
  }
  const dirUrl = p => `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
  // Link for any attraction: its own website when we have one, otherwise its Google Maps listing
  // (which shows the website, hours, phone, and photos). Family homes get no link.
  function infoLink(p, cls = "btn") {
    if (!p || p.type === "host" || p.type === "home" || p.type === "airport") return "";
    if (p.web) return `<a class="${cls}" href="${p.web}" target="_blank" rel="noopener">🔗 Website</a>`;
    const q = encodeURIComponent(p.name);
    return `<a class="${cls}" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">🔗 Info and hours</a>`;
  }

  function stopItem(id, kindLabel) {
    const isIdea = !P[id] && !!IDEA[id];
    const p = P[id] || mine.find(s => s.id === id) || IDEA[id]; if (!p) return "";
    const isMine = !P[id] && !isIdea;
    const icon = isIdea ? ICAT[p.cat].icon : isMine ? (MY_CATS[p.cat] || MY_CATS.note).icon : (p.emoji || (KIND[p.type] || {}).icon || "📍");
    const link = infoLink(p, "infolink");
    return `<li class="${done[id] ? "done" : ""}"><button data-stop="${id}"><span class="ic" aria-hidden="true">${icon}</span>
      <span><span class="k">${esc(kindLabel)}</span><span class="n">${esc(p.name)}</span></span></button>${link.replace(/>🔗[^<]*</, ' aria-label="Info and hours for ' + esc(p.name) + '">🔗<')}</li>`;
  }

  function showDay() {
    const body = $("sheetBody");
    if (selectedDay === null) {
      const td = todayDiff();
      const when = td < 0 ? `Starts in ${-td} days` : td >= T.days.length ? "Trip complete" : `Today is day ${td + 1}`;
      body.innerHTML = `
        <div class="head">${shield(T.days.length)}<div><h2>The whole trip</h2><p>${T.days.length} days, July 3 to 31 · ${when}</p></div></div>
        <p class="summary">Step through the trip one leg at a time, or pick a day at the top. Tap any stop to see it on the map.</p>
        <div class="stagehead" style="grid-template-columns:1fr auto"><b>${STAGES.length} legs</b><button class="btn primary" data-stage="0">Start with leg 1 ▶</button></div>
        <ul class="stagelist">${STAGES.map((st, k) => `<li><button data-stage="${k}"><b>${k + 1}</b><span>${esc(st.title)}<small>${stageDates(k)} · ${stageMiles(k) ? stageMiles(k).toLocaleString() + " mi" : "no long drives"}</small></span></button></li>`).join("")}</ul>
        <p class="fineprint">Use the buttons at the top to show only food, attractions, biking, swimming, views, or places to sleep. “Ideas on” adds the stops you can vote on.</p>
        <h3 class="section-title">My spots (${mine.length})</h3>
        ${mine.length ? `<ul class="stops">${mine.map(s => stopItem(s.id, s.day === null || s.day === undefined ? (MY_CATS[s.cat] || MY_CATS.note).label : `Day ${s.day + 1} · ${(MY_CATS[s.cat] || MY_CATS.note).label}`)).join("")}</ul>`
          : `<p class="fineprint">Nothing added yet. Tap “+ Add a spot” to drop a pin anywhere on the map.</p>`}
        <p class="fineprint">App version 16 (national parks)</p>
        <h3 class="section-title">Share my spots</h3>
        <p class="fineprint">Spots are saved on this phone. To share them, export a file and import it on another phone.</p>
        <div class="btnrow">
          <button class="btn" id="exportBtn">Export my spots</button>
          <label class="btn" for="importFile">Import spots</label>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>`;
      return;
    }
    const d = T.days[selectedDay];
    const parts = [];
    if (d.drive) parts.push(`<p class="summary">🚗 ${esc(d.drive.from)} to ${esc(d.drive.to)}, about ${d.drive.miles} miles and ${d.drive.hours} hours.</p>`);
    if (d.note) parts.push(`<p class="summary">⚠️ ${esc(d.note)}</p>`);
    const items = [];
    if (d.ride) d.ride.places.forEach(id => items.push(stopItem(id, "Ride")));
    (d.meals || []).forEach(([m, id]) => items.push(stopItem(id, m)));
    (d.fun || []).forEach(id => items.push(stopItem(id, "Fun stop")));
    (d.extra || []).forEach(id => items.push(stopItem(id, "Heads up")));
    mine.filter(s => s.day === selectedDay).forEach(s => items.push(stopItem(s.id, "My spot")));
    if (d.stay) items.push(stopItem(d.stay, "Tonight"));
    $("sheetBody").innerHTML = `
      <div class="head">${shield(selectedDay + 1)}<div><h2>${esc(d.title)}</h2><p>${longDate(d.date)}</p></div></div>
      ${d.ride ? `<p class="summary">🚵 ${esc(d.ride.text)}</p>` : ""}
      ${parts.join("")}
      <ul class="stops">${items.join("")}</ul>
      <div class="btnrow">
        <button class="btn" data-nav="${selectedDay - 1}" ${selectedDay === 0 ? "disabled" : ""}>Previous day</button>
        <button class="btn" data-nav="${selectedDay + 1}" ${selectedDay === T.days.length - 1 ? "disabled" : ""}>Next day</button>
      </div>`;
  }

  function showPlace(id) {
    const p = P[id]; const k = KIND[p.type] || {};
    const di = dayOf[id];
    const canVisit = p.type === "fun" || p.type === "meal";
    $("sheetBody").innerHTML = `<div class="detail"><div class="backrow"><button class="btn" data-backsheet="1">◀ Back to ${activeStage === null ? "the trip" : "leg " + (activeStage + 1)}</button></div>
      <h2>${p.emoji ? p.emoji + " " : ""}${esc(p.name)}</h2>
      <p class="kind">${esc(k.label || "")}${di !== undefined ? ` · Day ${di + 1}, ${longDate(T.days[di].date)}` : ""}</p>
      ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
      <div class="btnrow">
        <a class="btn primary" href="${dirUrl(p)}" target="_blank" rel="noopener">Directions</a>
        ${p.link ? `<a class="btn" href="${p.link}" target="_blank" rel="noopener">Trail info</a>` : ""}
        ${infoLink(p)}
        ${canVisit ? `<button class="btn" data-visit="${id}">${done[id] ? "Visited ✓" : "Mark visited"}</button>` : ""}
        ${di !== undefined ? `<button class="btn" data-goday="${di}">See day ${di + 1}</button>` : ""}
      </div></div>`;
    setOpen(true);
    focusOn(p.lat, p.lng);
  }

  function showMine(id) {
    const s = mine.find(x => x.id === id); if (!s) return;
    const c = MY_CATS[s.cat] || MY_CATS.note;
    $("sheetBody").innerHTML = `<div class="detail"><div class="backrow"><button class="btn" data-backsheet="1">◀ Back to ${activeStage === null ? "the trip" : "leg " + (activeStage + 1)}</button></div>
      <h2>${c.icon} ${esc(s.name)}</h2>
      <p class="kind">My spot · ${esc(c.label)}${s.day !== null && s.day !== undefined ? ` · Day ${s.day + 1}` : ""}</p>
      ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
      <div class="btnrow">
        <a class="btn primary" href="${dirUrl(s)}" target="_blank" rel="noopener">Directions</a>
        ${voteBtn(id)}
        <button class="btn" data-visit="${id}">${done[id] ? "Visited ✓" : "Mark visited"}</button>
        <button class="btn" data-edit="${id}">Edit</button>
        <button class="btn" data-move="${id}">Move pin</button>
        <button class="btn danger" data-delete="${id}">Delete</button>
      </div></div>`;
    setOpen(true);
    focusOn(s.lat, s.lng);
  }

  // ---------- adding spots ----------
  let pending = null; // { lat, lng, editId, moveId }
  function startPlacing(moveId) {
    document.body.classList.add("adding"); setOpen(false);
    $("crosshair").hidden = false; $("placebar").hidden = false;
    pending = { moveId: moveId || null };
  }
  function stopPlacing() {
    document.body.classList.remove("adding");
    $("crosshair").hidden = true; $("placebar").hidden = true;
  }
  $("addBtn").onclick = () => startPlacing();
  $("cancelPlace").onclick = () => { stopPlacing(); pending = null; };
  $("confirmPlace").onclick = () => {
    // The crosshair's tip sits at the screen center
    const c = map.getCenter();
    stopPlacing();
    if (pending && pending.moveId) {
      const s = mine.find(x => x.id === pending.moveId);
      if (s) { s.lat = c.lat; s.lng = c.lng; saveMine(); syncSpot(s); showMine(s.id); }
      pending = null; return;
    }
    showForm({ lat: c.lat, lng: c.lng, name: "", cat: "fun", day: selectedDay, note: "" });
  };

  function showForm(s) {
    const isEdit = !!s.id;
    $("sheetBody").innerHTML = `<form class="add" id="addForm" novalidate>
      <h2>${isEdit ? "Edit spot" : "New spot"}</h2>
      <label for="fName">Name</label>
      <input id="fName" maxlength="80" value="${esc(s.name)}" placeholder="For example, giant fiberglass cow" autocomplete="off">
      <label>Type</label>
      <div class="cats" id="fCats">${Object.entries(MY_CATS).map(([k, c]) =>
        `<button type="button" class="btn" data-cat="${k}" aria-pressed="${s.cat === k}">${c.icon} ${c.label}</button>`).join("")}</div>
      <label for="fDay">Day</label>
      <select id="fDay"><option value="">Any day</option>${T.days.map((d, i) =>
        `<option value="${i}" ${s.day === i ? "selected" : ""}>Day ${i + 1}: ${longDate(d.date)}</option>`).join("")}</select>
      <label for="fNote">Note</label>
      <textarea id="fNote" maxlength="400" placeholder="Hours, what to order, why it’s worth stopping">${esc(s.note)}</textarea>
      <p class="formerror" id="fErr" hidden>Give the spot a name.</p>
      <div class="btnrow" style="margin-top:12px">
        <button type="button" class="btn" id="fCancel">Cancel</button>
        <button type="submit" class="btn primary">${isEdit ? "Save changes" : "Save spot"}</button>
      </div></form>`;
    setOpen(true);
    let cat = s.cat;
    $("fCats").onclick = e => {
      const b = e.target.closest("[data-cat]"); if (!b) return;
      cat = b.dataset.cat;
      $("fCats").querySelectorAll("[data-cat]").forEach(x => x.setAttribute("aria-pressed", x === b));
    };
    $("fCancel").onclick = () => isEdit ? showMine(s.id) : renderSheet();
    $("addForm").onsubmit = e => {
      e.preventDefault();
      const name = $("fName").value.trim();
      if (!name) { $("fErr").hidden = false; $("fName").focus(); return; }
      const dayVal = $("fDay").value;
      const rec = { id: s.id || "u" + Date.now(), name, cat, day: dayVal === "" ? null : Number(dayVal), note: $("fNote").value.trim(), lat: s.lat, lng: s.lng };
      if (isEdit) mine = mine.map(x => x.id === s.id ? rec : x); else mine.push(rec);
      saveMine(); syncSpot(rec); showMine(rec.id);
    };
    if (!isEdit) setTimeout(() => $("fName").focus(), 250);
  }

  function saveMine() { store.set("mine", mine); drawMine(); applyFilters(); highlightDay(); }

  // ---------- export / import ----------
  function exportMine() {
    const blob = new Blob([JSON.stringify({ app: "road-trip-2027", spots: mine }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "my-trip-spots.json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function importMine(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        const spots = Array.isArray(data) ? data : data.spots;
        if (!Array.isArray(spots)) throw new Error();
        let added = 0;
        spots.forEach(s => {
          if (typeof s.lat !== "number" || typeof s.lng !== "number" || !s.name) return;
          if (mine.some(x => x.id === s.id)) return;
          const rec = { id: s.id || "u" + Date.now() + added, name: String(s.name).slice(0, 80), cat: MY_CATS[s.cat] ? s.cat : "note",
            day: Number.isInteger(s.day) ? s.day : null, note: String(s.note || "").slice(0, 400), lat: s.lat, lng: s.lng };
          mine.push(rec); syncSpot(rec);
          added++;
        });
        saveMine(); renderSheet();
        alert(added ? `Imported ${added} spot${added === 1 ? "" : "s"}.` : "No new spots in that file.");
      } catch (e) { alert("That file isn’t a spots export from this app."); }
    };
    r.readAsText(file);
  }

  // ---------- locate ----------
  let meMarker = null;
  $("locateBtn").onclick = () => {
    if (!navigator.geolocation) { alert("This browser can’t share your location."); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      const ll = [pos.coords.latitude, pos.coords.longitude];
      if (meMarker) meMarker.setLatLng(ll);
      else meMarker = L.circleMarker(ll, { radius: 8, color: "#fff", weight: 3, fillColor: "#1D4E89", fillOpacity: 1 }).addTo(map);
      map.setView(ll, 12);
    }, () => alert("Location is off. Turn it on in your phone’s settings to see where you are."), { enableHighAccuracy: true, timeout: 10000 });
  };


  // ---------- votes ----------
  const keyOf = n => (n || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 30) || "someone";
  const vkey = id => (id && id.startsWith("i_") && IDEA[id.slice(2)]) ? id.slice(2) : id; // spots added from ideas share the idea's votes
  const voteNames = id => Object.values(votes[vkey(id)] || {});
  const iVoted = id => !!(votes[vkey(id)] || {})[keyOf(voterName)];
  function voteBtn(id) {
    const n = voteNames(id).length;
    return `<button class="btn vote" data-vote="${id}" aria-pressed="${iVoted(id)}" aria-label="Vote for this stop, ${n} vote${n === 1 ? "" : "s"} so far">👍 ${n}</button>`;
  }
  function votersLine(id) { const v = voteNames(id); return v.length ? `<p class="voters">Votes: ${v.map(esc).join(", ")}</p>` : ""; }
  function askName() {
    const n = prompt("What’s your name? Your votes show up with it.", voterName || "");
    if (n && n.trim()) { voterName = n.trim().slice(0, 30); store.set("voter", voterName); return true; }
    return false;
  }
  function toggleVote(id) {
    id = vkey(id);
    if (!voterName && !askName()) return;
    const k = keyOf(voterName);
    votes[id] = Object.assign({}, votes[id]);
    const on = !votes[id][k];
    if (on) votes[id][k] = voterName; else delete votes[id][k];
    store.set("votes", votes);
    if (shared) window.TripSync.setVote(id, k, voterName, on);
    refreshAll();
  }
  function toggleDone(id) {
    done[id] = !done[id]; if (!done[id]) delete done[id];
    store.set("done", done);
    if (shared) window.TripSync.setDone(id, !!done[id]);

  function syncSpot(rec) { if (shared) window.TripSync.setSpot(rec); }

  // ---------- ideas ----------
  function addIdeaToPlan(id) {
    const x = IDEA[id]; const sid = "i_" + id;
    if (mine.some(s => s.id === sid)) return;
    const cat = x.cat === "eat" ? "meal" : x.cat === "view" ? "view" : x.cat === "swim" ? "swim" : x.cat === "ride" ? "ride" : "fun";
    const rec = { id: sid, name: x.name, cat, day: x.day, note: `${x.note} (${x.detour})`, lat: x.lat, lng: x.lng, park: x.cat === "park" || undefined };

  function showIdea(id) {

  let ideaSort = store.get("ideaSort", "trip");

      ${list.map(x => {

          <p class="meta">${c.label} · Day ${x.day + 1}, ${longDate(T.days[x.day].date)} · ${esc(x.detour)}</p>
          <p>${esc(x.note)}</p>

            ${voteBtn(x.id)}

      ${myIdeas.length ? `<h2 class="legtitle">Stops the family added</h2>${myIdeas.map(sp => {
        const c = MY_CATS[sp.cat] || MY_CATS.note;
        return `<article class="idea"><h3>${c.icon} ${esc(sp.name)}</h3>
          <p class="meta">${c.label}${sp.day !== null && sp.day !== undefined ? ` · Day ${sp.day + 1}` : ""}</p>
          ${sp.note ? `<p>${esc(sp.note)}</p>` : ""}
          <div class="btnrow">${voteBtn(sp.id)}<button class="btn" data-showmap="${sp.id}">Show on map</button></div>${votersLine(sp.id)}</article>`; }).join("")}` : ""}
    </div>`;
  }

  function refreshAll() {
    drawMine(); applyFilters(); highlightDay();
    if (mode === "map" && activeStage !== null && !document.querySelector("#sheetBody .detail, #sheetBody form")) renderStageSheet();
    if (mode === "list") renderList();
